<!DOCTYPE html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>5€ FANTASMA — Prenoti. Accumuli. Risparmi.</title>
<style>
:root{--bg:#09090D;--pn:#15151C;--v:#8B5CF6;--vl:#C4B5FD;--mu:#9a9aab;--ln:#26262f}
*{box-sizing:border-box;margin:0}body{background:var(--bg);color:#fff;font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
a{color:inherit;text-decoration:none}h1,h2,h3{letter-spacing:-.02em;line-height:1.1}
header{position:sticky;top:0;z-index:5;background:#09090Dee;backdrop-filter:blur(10px);border-bottom:1px solid var(--ln);display:flex;align-items:center;gap:14px;padding:12px 20px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;letter-spacing:.04em}.logo svg{width:24px;height:24px}
nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}nav a{padding:7px 12px;border-radius:99px;color:var(--mu);font-size:14px}nav a:hover,nav a.on{color:#fff;background:var(--pn)}
main{max-width:1000px;margin:auto;padding:24px 20px 60px;animation:in .4s}@keyframes in{from{opacity:0;transform:translateY(8px)}}
.btn{display:inline-block;background:var(--v);color:#fff;border:0;border-radius:12px;padding:12px 20px;font:600 15px inherit;cursor:pointer;transition:.2s}.btn:hover{background:#7c3aed;transform:translateY(-1px)}
.btn.g{background:transparent;border:1px solid var(--v);color:var(--vl)}.btn.sm{padding:7px 12px;font-size:13px}.btn:disabled{opacity:.5}
.hero{padding:70px 0 50px;text-align:center}.hero h1{font-size:clamp(40px,9vw,84px);margin:18px 0}.hero h1 span{color:var(--v)}.hero p{color:var(--mu);font-size:20px}
.ghost{width:76px;filter:drop-shadow(0 0 24px #8B5CF688);animation:fl 4s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-8px)}}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:28px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:18px;padding:20px}.card.h:hover{border-color:var(--v)}
.img{height:130px;border-radius:12px;margin-bottom:12px;display:grid;place-items:center;font-size:44px}
section{margin:60px 0}section>h2{font-size:30px;margin-bottom:18px}.mu{color:var(--mu)}.vl{color:var(--vl)}.sm{font-size:13px}
.n{font:800 34px/1 system-ui;color:var(--v)}
input,select{background:#0e0e13;color:#fff;border:1px solid var(--ln);border-radius:10px;padding:11px;font:inherit;width:100%}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;align-items:end}
.dots{display:flex;gap:8px;margin:16px 0}.dot{flex:1;height:44px;border-radius:12px;border:1px solid var(--ln);display:grid;place-items:center;color:var(--mu)}.dot.on{background:var(--v);border-color:var(--v);color:#fff;box-shadow:0 0 16px #8B5CF688;animation:pop .5s}@keyframes pop{from{transform:scale(.7)}}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:10px 6px;border-bottom:1px solid var(--ln);text-align:left}th{color:var(--mu);font-weight:500}
.tag{font-size:12px;padding:3px 9px;border-radius:99px;background:#8B5CF626;color:var(--vl)}.tag.r{background:#f871711f;color:#fca5a5}
.demo{background:#8B5CF61f;color:var(--vl);text-align:center;font-size:12px;padding:5px}
.sum div{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--ln)}
.cp{border:1px dashed var(--v);border-radius:16px;padding:18px;background:linear-gradient(135deg,#8B5CF61f,transparent)}.code{font:700 22px monospace;color:var(--vl);letter-spacing:.1em}
details{background:var(--pn);border-radius:12px;padding:14px;margin-bottom:8px}summary{cursor:pointer;font-weight:600}
footer{border-top:1px solid var(--ln);padding:30px 20px;color:var(--mu);font-size:13px;text-align:center}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--v);padding:12px 20px;border-radius:12px;z-index:9}
</style></head><body>
<div class="demo">MODALITÀ DEMO — nessun pagamento reale · dati salvati solo nel tuo browser</div>
<header><a href="#/" class="logo" id="lg"></a><nav id="nv"></nav></header>
<main id="app"></main>
<footer>© 2026 5€ FANTASMA · <a href="#/info">Termini di servizio</a> · <a href="#/info">Privacy</a> · <a href="#/info">Condizioni di prenotazione</a> · ciao@5efantasma.example</footer>
<script>
const GH=(s=24)=>`<svg viewBox="0 0 24 24" width="${s}" fill="none" stroke="#8B5CF6" stroke-width="1.8" stroke-linejoin="round"><path d="M5 21V10a7 7 0 0114 0v11l-2.3-2-2.4 2-2.3-2-2.3 2-2.4-2z"/><circle cx="9.5" cy="10" r="1" fill="#8B5CF6"/><circle cx="14.5" cy="10" r="1" fill="#8B5CF6"/></svg>`;
document.getElementById('lg').innerHTML=GH()+'5€ FANTASMA';
const REST=[{id:1,n:'Osteria dei Portici',c:'Bologna',k:'Emiliana',p:35,e:'🍝',h:270,d:'Tortellini fatti a mano sotto i portici del centro.',a:'Via Clavature 12'},
{id:2,n:'Pizzeria Luna Nera',c:'Milano',k:'Pizzeria',p:22,e:'🍕',h:280,d:'Impasto a lunga lievitazione, forno a legna.',a:'Via Tortona 40'},
{id:3,n:'Sakura Nord',c:'Milano',k:'Giapponese',p:48,e:'🍣',h:300,d:'Omakase e sushi di stagione.',a:'Corso Garibaldi 8'},
{id:4,n:'Trattoria Il Sole',c:'Roma',k:'Romana',p:30,e:'🥘',h:255,d:'Carbonara, amatriciana e cucina del quinto quarto.',a:'Via dei Giubbonari 5'},
{id:5,n:'Fiamma & Brace',c:'Torino',k:'Steakhouse',p:55,e:'🥩',h:265,d:'Carni piemontesi alla brace.',a:'Via Po 21'}];
const SLOTS=['12:30','13:00','13:30','19:30','20:00','20:30','21:00'];
const seed={user:null,cfg:{pct:18,cType:'€',cVal:5,min:25,valid:90},bk:[],cp:[],log:[],rules:{1:'Cancellazione gratuita fino a 24h prima: caparra rimborsata.'}};
for(let i=0;i<6;i++)seed.bk.push({id:'S'+i,r:(i%5)+1,date:'2026-0'+(i+1)+'-1'+i,t:'20:00',cov:2,est:70,dep:12.6,st:'completata',pay:'pagata'});
let S=JSON.parse(localStorage.getItem('f5')||'null')||seed;const save=()=>localStorage.setItem('f5',JSON.stringify(S));
const eur=x=>x.toFixed(2).replace('.',',')+' €';const dep=est=>Math.round(est*S.cfg.pct)/100;
const done=()=>S.bk.filter(b=>b.st==='completata').length;
const cv=()=>S.cfg.cType==='%'?S.cfg.cVal+'% di sconto':eur(S.cfg.cVal)+' di sconto';
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),2600)}
function issue(){const n=Math.floor(done()/8),have=S.cp.length;for(let i=have;i<n;i++){const c={code:'FNT-'+Math.random().toString(36).slice(2,8).toUpperCase(),v:cv(),min:S.cfg.min,exp:new Date(Date.now()+S.cfg.valid*864e5).toISOString().slice(0,10),used:false};S.cp.push(c);S.log.push('Emesso '+c.code)}}
const pageHdr=t=>`<h1 style="font-size:34px;margin-bottom:6px">${t}</h1>`;
const cards=l=>l.map(r=>`<a class="card h" href="#/r/${r.id}"><div class="img" style="background:linear-gradient(135deg,hsl(${r.h},60%,22%),#15151C)">${r.e}</div><h3>${r.n}</h3><p class="mu sm">${r.c} · ${r.k} · ~${r.p} € a persona</p></a>`).join('');
const V={
'/':()=>`<div class="hero"><div class="ghost">${GH(76)}</div><h1>5€ <span>FANTASMA</span></h1><p>Prenoti. Accumuli. Risparmi.</p><div class="row"><a class="btn" href="#/cerca">Scopri i ristoranti</a><a class="btn g" href="#/rist">Diventa partner</a></div></div>
<section><h2>Come funziona</h2><div class="grid">${[['1','Prenota','Scegli ristorante, data, ora e coperti.'],['2','Paga la caparra','Il '+S.cfg.pct+'% del conto stimato, sempre mostrato prima del pagamento.'],['3','Accumula premi','Ogni prenotazione completata vale un punto.']].map(x=>`<div class="card"><div class="n">${x[0]}</div><h3 style="margin:8px 0">${x[1]}</h3><p class="mu">${x[2]}</p></div>`).join('')}</div></section>
<section><h2>Ristoranti affiliati</h2><div class="grid">${cards(REST.slice(0,3))}</div><p style="margin-top:14px"><a class="vl" href="#/cerca">Vedi tutti →</a></p></section>
<section><h2>Il Club Fantasma</h2><div class="card"><p class="mu">8 prenotazioni completate = un coupon (${cv()}) spendibile in qualsiasi locale aderente.</p><div class="dots">${[1,2,3,4,5,6,7,8].map(i=>`<div class="dot ${i<=3?'on':''}">${i}</div>`).join('')}</div></div></section>
<section><h2>Per i ristoratori</h2><div class="grid">${['Meno no-show grazie alla caparra','Calendario e tavoli in un unico posto','Coupon verificati con codice o QR'].map(t=>`<div class="card">${t}</div>`).join('')}</div><div class="row" style="justify-content:flex-start"><a class="btn" href="#/rist">Apri la dashboard demo</a></div></section>
<section><h2>FAQ</h2>${[['Quanto costa la caparra?','Il '+S.cfg.pct+'% del totale stimato, mostrata prima del pagamento. Esempio: conto 100 €, caparra 18 €, residuo 82 €.'],['Posso cancellare?','Sì, secondo le regole di cancellazione indicate dal locale nella scheda.'],['Come funzionano i coupon?','Un coupon ogni 8 prenotazioni completate, con scadenza e spesa minima visibili. Non cumulabile salvo diversa indicazione.'],['Privacy?','Trattiamo solo i dati necessari alla prenotazione (GDPR). Versione demo: dati solo nel tuo browser.']].map(f=>`<details><summary>${f[0]}</summary><p class="mu" style="margin-top:8px">${f[1]}</p></details>`).join('')}</section>`,
'/info':()=>pageHdr('Termini, privacy e condizioni')+'<p class="mu">Testi legali segnaposto: da sostituire con documenti redatti da un professionista prima del lancio.</p>',
'/login':()=>`<div class="card" style="max-width:400px;margin:30px auto">${pageHdr('Accedi / Registrati')}<label>Nome</label><input id="nm" placeholder="Mario Rossi"><label>Email</label><input id="em" type="email" placeholder="mario@email.it"><label>Password</label><input type="password" placeholder="••••••••"><button class="btn" style="width:100%;margin-top:16px" onclick="login()">Continua</button><p class="sm mu" style="margin-top:10px">Recupero password: disponibile con backend reale (Supabase).</p></div>`,
'/cerca':()=>{const q=Object.fromEntries(new URLSearchParams(location.hash.split('?')[1]||''));const cities=[...new Set(REST.map(r=>r.c))];
const l=REST.filter(r=>(!q.c||r.c===q.c)&&(!q.p||r.p<=+q.p));return pageHdr('Trova il tuo tavolo')+`<div class="card f" style="margin:16px 0"><div><label>Città</label><select id="fc"><option value="">Tutte</option>${cities.map(c=>`<option ${q.c===c?'selected':''}>${c}</option>`).join('')}</select></div><div><label>Prezzo max</label><select id="fp"><option value="">Qualsiasi</option>${[25,35,50].map(p=>`<option ${q.p==p?'selected':''}>${p}</option>`).join('')}</select></div><button class="btn" onclick="location.hash='/cerca?c='+fc.value+'&p='+fp.value">Cerca</button></div>`+(l.length?`<div class="grid">${cards(l)}</div>`:'<div class="card mu">Nessun ristorante trovato. Prova a cambiare i filtri.</div>')},
'/r/':id=>{const r=REST.find(x=>x.id==id);if(!r)return V['/cerca']();return `<div class="img" style="height:200px;background:linear-gradient(135deg,hsl(${r.h},60%,24%),#15151C);font-size:70px;border-radius:18px;display:grid;place-items:center">${r.e}</div><h1 style="margin:14px 0 4px">${r.n}</h1><p class="mu">${r.c} · ${r.k} · ${r.a}</p><p style="margin:10px 0">${r.d}</p>
<div class="card"><h3>Prenota un tavolo</h3><div class="f"><div><label>Data</label><input type="date" id="bd" value="2026-11-07"></div><div><label>Ora</label><select id="bt">${SLOTS.map(s=>`<option>${s}</option>`).join('')}</select></div><div><label>Coperti</label><input type="number" id="bc" min="1" max="12" value="2"></div></div><button class="btn" style="margin-top:14px" onclick="draft(${r.id})">Riepilogo e caparra</button></div>
<div class="card" style="margin-top:12px"><h3>Condizioni</h3><p class="mu sm">${S.rules[r.id]||'Cancellazione gratuita fino a 24h prima. Dopo tale termine la caparra non è rimborsabile.'}</p></div>`},
'/pay':()=>{const d=S.draft;if(!d)return V['/cerca']();const r=REST.find(x=>x.id==d.r),est=d.cov*r.p,dp=dep(est);return pageHdr('Riepilogo')+`<div class="card sum"><div><span>${r.n}</span><b>${d.date} · ${d.t} · ${d.cov} pers.</b></div><div><span>Conto stimato</span><b>${eur(est)}</b></div><div><span>Caparra anticipata (${S.cfg.pct}%)</span><b class="vl">${eur(dp)}</b></div><div><span>Residuo stimato al ristorante</span><b>${eur(est-dp)}</b></div><p class="sm mu" style="margin-top:12px">Nessuna commissione nascosta. Conferma solo dopo verifica di pagamento e disponibilità. ${S.rules[r.id]||''}</p><button class="btn" id="pb" style="margin-top:14px;width:100%" onclick="pay()">Paga ${eur(dp)} (DEMO)</button></div>`},
'/ok':()=>{const b=S.bk.find(x=>x.id==S.last);if(!b)return V['/']();return `<div class="card" style="text-align:center;padding:40px"><div class="ghost" style="margin:auto">${GH(60)}</div><h1 style="margin:16px 0">Prenotazione confermata</h1><p class="mu">${REST.find(x=>x.id==b.r).n} · ${b.date} · ${b.t} · ${b.cov} pers.<br>Caparra pagata: ${eur(b.dep)}</p><div class="row"><a class="btn" href="#/storico">Le mie prenotazioni</a></div></div>`},
'/storico':()=>pageHdr('Le mie prenotazioni')+`<div class="card" style="margin-top:14px;overflow:auto"><table><tr><th>Locale</th><th>Data</th><th>Caparra</th><th>Stato</th><th></th></tr>${[...S.bk].reverse().map(b=>`<tr><td>${REST.find(r=>r.id==b.r).n}</td><td>${b.date} ${b.t}</td><td>${eur(b.dep)} · ${b.pay}</td><td><span class="tag ${b.st==='cancellata'?'r':''}">${b.st}</span></td><td>${b.st==='confermata'?`<button class="btn g sm" onclick="cancelB('${b.id}')">Cancella</button>`:''}</td></tr>`).join('')}</table><p class="sm mu" style="margin-top:10px">Assistenza: ciao@5efantasma.example</p></div>`,
'/fantasma':()=>{const n=done(),p=n%8;return pageHdr('Il mio Fantasma')+`<div class="card" style="margin-top:14px"><div class="n">${p}/8</div><p class="mu">Prenotazioni completate verso il prossimo coupon (${n} totali). Cancellate, rimborsate o fraudolente non contano.</p><div class="dots">${[1,2,3,4,5,6,7,8].map(i=>`<div class="dot ${i<=p?'on':''}">${i}</div>`).join('')}</div></div><p style="margin-top:14px"><a class="btn g" href="#/wallet">Apri il wallet (${S.cp.filter(c=>!c.used).length})</a></p>`},
'/wallet':()=>pageHdr('Wallet coupon')+`<div class="grid" style="margin-top:14px">${S.cp.length?S.cp.map(c=>`<div class="cp"><span class="tag ${c.used?'r':''}">${c.used?'riscattato':'disponibile'}</span><h3 style="margin:8px 0">${c.v}</h3><div class="code">${c.code}</div><p class="sm mu">Spesa minima ${eur(c.min)} · scade ${c.exp} · non cumulabile · valido nei locali aderenti</p></div>`).join(''):'<div class="card mu">Nessun coupon ancora. Completa 8 prenotazioni per ottenerne uno.</div>'}</div>`,
'/rist':()=>{const bs=S.bk.filter(b=>b.r==1||b.st!=='completata');return pageHdr('Dashboard ristoratore')+`<p class="mu">Demo: Osteria dei Portici</p><div class="grid" style="margin:16px 0">${[['Prenotazioni',S.bk.length],['Caparre incassate',eur(S.bk.filter(b=>b.pay==='pagata').reduce((a,b)=>a+b.dep,0))],['Completate',done()],['Coupon riscattati',S.cp.filter(c=>c.used).length]].map(x=>`<div class="card"><div class="n">${x[1]}</div><p class="mu sm">${x[0]}</p></div>`).join('')}</div>
<div class="card" style="overflow:auto"><h3>Prenotazioni</h3><table><tr><th>Cliente</th><th>Data</th><th>Pers.</th><th>Caparra</th><th>Stato</th><th></th></tr>${[...S.bk].reverse().slice(0,8).map(b=>`<tr><td>${S.user?S.user.n:'Ospite'}</td><td>${b.date} ${b.t}</td><td>${b.cov}</td><td>${eur(b.dep)}</td><td><span class="tag ${b.st==='cancellata'?'r':''}">${b.st}</span></td><td>${b.st==='confermata'?`<button class="btn sm" onclick="complete('${b.id}')">Segna presenza</button>`:''}</td></tr>`).join('')}</table></div>
<div class="card" style="margin-top:14px"><h3>Verifica coupon</h3><div class="f"><div><label>Codice (o scansiona QR)</label><input id="cc" placeholder="FNT-XXXXXX"></div><div><label>Spesa (€)</label><input id="cs" type="number" value="40"></div><button class="btn" onclick="redeem()">Riscatta</button></div></div>`},
'/admin':()=>pageHdr('Pannello amministratore')+`<div class="card" style="margin:14px 0"><h3>Configurazione</h3><div class="f"><div><label>Caparra %</label><input id="a1" type="number" value="${S.cfg.pct}"></div><div><label>Tipo coupon</label><select id="a2"><option ${S.cfg.cType==='€'?'selected':''}>€</option><option ${S.cfg.cType==='%'?'selected':''}>%</option></select></div><div><label>Valore</label><input id="a3" type="number" value="${S.cfg.cVal}"></div><div><label>Spesa minima €</label><input id="a4" type="number" value="${S.cfg.min}"></div><button class="btn" onclick="cfg()">Salva</button></div></div><div class="card"><h3>Registro operazioni</h3>${S.log.slice(-10).reverse().map(l=>`<p class="sm mu">• ${l}</p>`).join('')||'<p class="mu sm">Nessuna operazione.</p>'}<button class="btn g sm" style="margin-top:12px" onclick="localStorage.clear();location.reload()">Reimposta demo</button></div>`};
function login(){S.user={n:nm.value||'Ospite',e:em.value};save();location.hash='/cerca'}
function draft(id){if(!S.user){toast('Accedi per prenotare');location.hash='/login';return}if(bd.value<'2026-10-21'||bc.value<1){toast('Controlla data e coperti');return}S.draft={r:id,date:bd.value,t:bt.value,cov:+bc.value,key:Date.now()+''};save();location.hash='/pay'}
function pay(){const d=S.draft;if(!d||d.paid)return;pb.disabled=true;d.paid=1;
const taken=S.bk.filter(b=>b.r==d.r&&b.date==d.date&&b.t==d.t&&b.st==='confermata').length;
if(taken>=3){d.paid=0;save();toast('Fascia non più disponibile, nessun addebito');location.hash='/r/'+d.r;return}
const r=REST.find(x=>x.id==d.r),est=d.cov*r.p,b={id:d.key,r:d.r,date:d.date,t:d.t,cov:d.cov,est,dep:dep(est),st:'confermata',pay:'pagata'};
S.bk.push(b);S.log.push('Pagamento demo '+b.id);S.last=b.id;S.draft=null;save();location.hash='/ok'}
function cancelB(id){const b=S.bk.find(x=>x.id==id);b.st='cancellata';b.pay='rimborsata';S.log.push('Rimborso '+id);save();route()}
function complete(id){S.bk.find(x=>x.id==id).st='completata';issue();save();toast('Punto assegnato');route()}
function redeem(){const c=S.cp.find(x=>x.code===cc.value.trim().toUpperCase());if(!c)return toast('Codice non valido');if(c.used)return toast('Già riscattato');if(+cs.value<c.min)return toast('Spesa minima '+eur(c.min));c.used=true;S.log.push('Riscatto '+c.code);save();toast('Coupon riscattato: '+c.v);route()}
function cfg(){S.cfg={...S.cfg,pct:Math.min(50,Math.max(1,+a1.value)),cType:a2.value,cVal:+a3.value,min:+a4.value};S.log.push('Config aggiornata');save();toast('Salvato')}
function route(){const h=location.hash.slice(1)||'/';let k=h.split('?')[0],a;if(k.startsWith('/r/')){a=k.slice(3);k='/r/'}
document.getElementById('app').innerHTML=(V[k]||V['/'])(a);window.scrollTo(0,0);
nv.innerHTML=[['/cerca','Ristoranti'],['/storico','Prenotazioni'],['/fantasma','Il mio Fantasma'],['/wallet','Wallet'],['/rist','Ristoratore'],['/admin','Admin'],[S.user?'/login':'/login',S.user?S.user.n:'Accedi']].map(x=>`<a href="#${x[0]}" class="${h.startsWith(x[0])?'on':''}">${x[1]}</a>`).join('')}
addEventListener('hashchange',route);route();
</script></body></html>
